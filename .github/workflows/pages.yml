name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 04:00 UTC = 09:00 Almaty (UTC+5).
    - cron: '0 4 * * *'
  repository_dispatch:
    types: [external-catalog-updated]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Audit workflow security
        env:
          GH_TOKEN: ${{ github.token }}
        run: make workflow-lint
  build:
    runs-on: ubuntu-latest
    needs: lint-workflows
    timeout-minutes: 15
    # Tells the deploy job whether there is anything to publish: when the
    # environment cannot be prepared every step is skipped, so Pages is not touched.
    outputs:
      published: ${{ steps.pages.outcome }}
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 # zizmor: ignore[artipacked]
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.15'
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      # PyPI down: publish nothing and keep the job green, so the already
      # published catalog stays as it is and this update is simply deferred.
      - name: Prepare Python environment
        id: venv
        continue-on-error: true
        run: make venv
      - name: Report broken environment
        if: steps.venv.outcome != 'success'
        run: echo "::warning::cannot prepare Python environment, skipping this update"
      # One request per package, one attempt: the schedule and upstream
      # notifications make polling any harder pointless. An unreachable source
      # only warns, the catalog is built from what is already in packages/.
      - name: Sync remote packages
        if: steps.venv.outcome == 'success'
        id: sync
        continue-on-error: true
        timeout-minutes: 5
        run: make sync
      - name: Report sync problems
        if: steps.venv.outcome == 'success' && steps.sync.outcome == 'failure'
        run: echo "::warning::remote sync failed, publishing packages already committed"
      - name: Test repository generator
        if: steps.venv.outcome == 'success'
        run: make test
      - name: Lint Python
        if: steps.venv.outcome == 'success'
        run: make python-lint
      - name: Build repository
        if: steps.venv.outcome == 'success'
        run: make build
      # The repository is updated before Pages: a push failure must stop the
      # deployment instead of publishing packages that git does not have.
      - name: Commit and push refreshed packages
        id: commit
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.venv.outcome == 'success'
        env:
          BOT_NAME: github-actions[bot]
          BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          # No interactive prompts, they would hang until the job timeout.
          GIT_TERMINAL_PROMPT: '0'
          GIT_EDITOR: 'true'
        run: |
          set -euo pipefail
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git add packages trusted-keys.json

          if git diff --cached --quiet; then
            echo "No package changes to commit"
            exit 0
          fi

          git commit -m "chore(packages): sync remote IPKs [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected, rebasing onto main (attempt $attempt)"
            git pull --rebase --autostash origin main
          done
          echo "::error::could not push refreshed packages, check the rebase above"
          exit 1
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        if: steps.venv.outcome == 'success' && steps.commit.outcome != 'failure'
        id: pages
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request' && needs.build.outputs.published == 'success'
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
